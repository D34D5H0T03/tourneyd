# Example Configuration for tourneyd

# tourneyd settings. Copy to server.conf; lines are "key = value".
port = 8080
bind_addr = 127.0.0.1        # use 0.0.0.0 only if you want it reachable directly
doc_root = public
backlog = 128

max_children = 64
idle_timeout_sec = 10
request_timeout_sec = 15
max_requests_per_conn = 100

max_body_size = 1048576
max_header_bytes = 16384
shutdown_grace_sec = 10
trust_proxy = off            # on only when behind cloudflared