<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Detail | tourneyd</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/common.js" defer></script>
    <script src="/js/challenge.js" defer></script>
</head>
<body>
    <aside class="sidebar">
        <div>
            <a href="/" class="brand">tourneyd</a>
            <div class="sidebar-label">// Navigation</div>
            <nav class="nav-links">
                <a href="/event/ctf/challenges.html" class="nav-item"><span>&larr; Back to Targets</span></a>
            </nav>
        </div>
        <div class="sys-status">
            [MODE] ACTIVE_TARGET<br>
            [STATUS] AWAITING_FLAG
        </div>
    </aside>
    <main class="content">
        <h1 id="title">Loading Target...</h1>
        <div class="archive-header">
            <span id="meta-category" class="badge"></span>
            <span id="meta-points"></span>
        </div>
        
        <!-- Hero Text Box -->
        <pre id="description" class="prose hero-text-box challenge-text"></pre>

        <!-- Flag Submission UI -->
        <form id="flag-form" class="flag-form" hidden>
            <div class="flag-input-group">
                <input id="flag" type="text" class="flag-input" maxlength="256" autocomplete="off" spellcheck="false" placeholder="tourney{...}">
                <button id="submit" type="submit" class="btn-submit">SUBMIT</button>
            </div>
            <p id="result" class="result-msg"></p>
        </form>
    </main>
</body>
</html>
